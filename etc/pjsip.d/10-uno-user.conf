[transport-udp-local]
type=transport
protocol=udp
bind=0.0.0.0:5060
allow_reload=yes

[uno-auth]
type=auth
auth_type=userpass
username=uno
password=password123

[uno-aor]
type=aor
max_contacts=5
remove_existing=yes

[uno]
type=endpoint
aors=uno-aor
auth=uno-auth
context=from-internal
disallow=all
allow=ulaw
allow=alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
transport=transport-udp-local
