; NOTE: If you see malformed transport lines like "transport=transport-udp-local-local"
; or bare "transport=transport-udp" in generated runtime files, run the maintenance script:
;    sudo ./bin/fix-pjsip-transport.sh
; The script will normalize transport lines to "transport=transport-udp-local",
; reload PJSIP in the running asterisk container, and show endpoint/aor/auth status.

; Default test SIP user for local testing
[uno_auth]
type=auth
auth_type=userpass
password=uno1234
username=uno

[uno_aor]
type=aor
max_contacts=1

[uno_endpoint]
type=endpoint
transport=transport-udp-local
context=from-internal
disallow=all
allow=ulaw,alaw
auth=uno_auth
aors=uno_aor
direct_media=no

[uno_identify]
type=identify
endpoint=uno_endpoint
match=0.0.0.0/0
