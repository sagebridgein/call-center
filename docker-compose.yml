# Docker Compose for the Wazo call-center stack.
# Note: the `version` key is obsolete for modern docker compose and has
# been removed to avoid the deprecation warning.

services:
  nginx:
    image: nginx
    ports:
      - "80:80"
      - "443:443"
      - "[::]:8080:80"
      - "[::]:8443:443"
    env_file:
      - variables.env
    volumes:
      - ./etc/nginx-auth-shared.conf:/etc/nginx/wazo-auth-shared.conf:ro
      - ./etc/nginx-calld-shared.conf:/etc/nginx/wazo-calld-shared.conf:ro
      - ./etc/nginx-confd-shared.conf:/etc/nginx/wazo-confd-shared.conf:ro
      - ./etc/nginx-no-auth-shared.conf:/etc/nginx/wazo-no-auth-shared.conf:ro
      - ./etc/nginx.conf:/etc/nginx/conf.d/config.conf:ro
      - ./certs:/certs:ro
    depends_on: # Avoid to fail container if host doesn't exist
      - amid
      - asterisk
      - auth
      - call-logd
      - chatd
      - confd
      - dird
      - phoned
      - provd
      - ui
      - webhookd
      - websocketd

  postgres:
    image: postgres:13 # Must use compatible version than the odbc_postgresql installed in asterisk container
    env_file:
      - variables.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asterisk -d wazo"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-migrator:
    build:
      context: ./docker/db-migrator
  # db-migrator is a one-shot service that runs DB init and alembic
  # migrations from the host-mounted `./repos` directory. It must be
  # run before other services that expect DB schemas to exist.
    environment:
      - MIGRATOR_VENV_CACHE=/var/lib/db-migrator/venv_cache
      - MIGRATOR_LOG_DIR=/var/log/db-migrator
      - WAZO_DB_INIT_DB=true
    env_file:
      - variables.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./repos:/home/ubuntu:rw
      - migrator-venv-cache:/var/lib/db-migrator/venv_cache:rw
      - migrator-logs:/var/log/db-migrator:rw
    networks:
      - default

  rabbitmq:
    image: rabbitmq:latest
    env_file:
      - variables.env
    expose:
      - "5672"
    volumes:
      - tmp-rabbitmq:/var/lib/rabbitmq:rw

  auth:
    build:
      context: ./repos/wazo-auth
    volumes:
      - ./etc/wazo-auth.yml:/etc/wazo-auth/conf.d/01-docker.yml:ro
    environment:
      POSTGRES_DB: wazo
      POSTGRES_USER: asterisk # reason: hardcoded in populate.sql
      POSTGRES_PASSWORD: secret
    env_file:
      - variables.env
    depends_on:
      - postgres
    networks:
      - default
      - wazo

  confd:
    build:
      context: ./repos/wazo-confd
    environment:
      - WAZO_DB_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    env_file:
      - variables.env
    volumes:
      - ./etc/wazo-confd.yml:/etc/wazo-confd/conf.d/01-docker.yml:ro
      - wazo-auth-keys:/var/lib/wazo-auth-keys:ro
    depends_on:
      - auth
      - rabbitmq
      - bootstrap
    networks:
      - default
      - wazo
    tmpfs:
      - /var/run/wazo-confd

  provd:
    build:
      context: ./repos/wazo-provd
    env_file:
      - variables.env
    tty: true
    volumes:
      - ./etc/wazo-provd.yml:/etc/wazo-provd/conf.d/01-docker.yml:ro
      - wazo-auth-keys:/var/lib/wazo-auth-keys:ro
    depends_on:
      - rabbitmq
      - auth
      - confgend
    networks:
      - default
      - wazo

  sysconfd:
    build:
      context: ./repos/wazo-sysconfd
    env_file:
      - variables.env
    expose:
      - 8668
    volumes:
      - ./etc/wazo-sysconfd.yml:/etc/wazo-sysconfd/conf.d/config.yml:ro

  webhookd:
    build:
      context: ./repos/wazo-webhookd
    env_file:
      - variables.env
    depends_on:
      - rabbitmq
    networks:
      - default

  asterisk:
    build:
      context: .
      dockerfile: Dockerfile-asterisk
    # Default hostname (ex: 961d946e0e66) is not compatible with sip stack used by wazo-js-sdk (SIP.js)
    hostname: asterisk.wazo-docker
    env_file:
      - variables.env
    expose:
      - "5038" # AMI
      - "5040-5044" # HTTP (ARI/AJAM)
    ports:
      - "5060:5060/udp" # SIP
      - "19980-20000:19980-20000/udp" # RTP
    volumes:
      - ./bin/init-helpers:/var/lib/wazo/helpers:ro
      - ./etc/wazo-confgend-client.conf:/etc/wazo-confgend-client/config.conf:ro
      - ./etc/asterisk-http.conf:/etc/asterisk/http.conf:ro
      - ./etc/asterisk-extensions.conf:/etc/asterisk/extensions.d/02-docker.conf:ro
      - ./etc/asterisk-odbc.ini:/etc/odbc.ini:ro
      - ./etc/asterisk-res_odbc.conf:/etc/asterisk/res_odbc.d/02-docker.conf:ro
      - ./etc/asterisk-manager.conf:/etc/asterisk/manager.d/999-docker.conf:ro
      - ./etc/asterisk-ari.conf:/etc/asterisk/ari.d/01-docker.conf:ro
      - ./etc/asterisk-dundi.conf:/etc/asterisk/dundi.conf:ro
      - ./etc/asterisk-hep.conf:/etc/asterisk/hep.conf:ro
      - ./bin/init-asterisk:/bin/asterisk/init:ro
      - asterisk-autoprov:/etc/asterisk/pjsip.d:rw
      - asterisk-doc:/usr/share/asterisk/documentation:rw
      - asterisk-voicemail:/var/spool/asterisk/voicemail:rw
      - ./etc/asterisk-pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./etc/asterisk-pjsip-00-transport.conf:/etc/asterisk/pjsip.d/00-transport.conf:ro
      # xivo-config has too much dependencies to be installed in the container
      - type: bind
        source: ./xivo-config/etc/xivo/asterisk
        target: /etc/xivo/asterisk
        read_only: true
      - type: bind
        source: ./xivo-config/dialplan/asterisk
        target: /usr/share/xivo-config/dialplan/asterisk
        read_only: true
    entrypoint: ["/bin/asterisk/init"]
    command: ["sh", "-c", "python3 /usr/local/bin/ajam-server.py & asterisk -fTvvv"]

  confgend:
    build:
      context: ./repos/wazo-confgend
    env_file:
      - variables.env
    expose:
      - 8667
      - 8669
    volumes:
      - ./etc/wazo-confgend.yml:/etc/wazo-confgend/conf.d/config.yml:ro

  agid:
    build:
      context: ./repos/wazo-agid
    environment:
      - WAZO_DB_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    env_file:
      - variables.env
    depends_on:
      - rabbitmq
      - asterisk
    networks:
      - default
    volumes:
      - ./etc/wazo-agid.yml:/etc/wazo-agid/conf.d/01-docker.yml:ro
      - wazo-auth-keys:/var/lib/wazo-auth-keys:ro

  dird:
    build:
      context: .
      dockerfile: Dockerfile-dird
    environment:
      - WAZO_DB_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    env_file:
      - variables.env
    depends_on:
      - rabbitmq
    networks:
      - default

  amid:
    build:
      context: ./repos/wazo-amid
    env_file:
      - variables.env
    volumes:
      - ./etc/wazo-amid.yml:/etc/wazo-amid/conf.d/01-docker.yml:ro
      - wazo-auth-keys:/var/lib/wazo-auth-keys:ro
    depends_on:
      - rabbitmq
      - asterisk
      - bootstrap
    networks:
      - default

  call-logd:
    build:
      context: ./repos/wazo-call-logd
    environment:
      - WAZO_DB_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    env_file:
      - variables.env
    depends_on:
      - rabbitmq
    networks:
      - default
    volumes:
      - ./etc/wazo-call-logd.yml:/etc/wazo-call-logd/config.yml:ro
      - wazo-auth-keys:/var/lib/wazo-auth-keys:ro
    healthcheck:
      # Robust healthcheck: try an HTTP status (accept 200 or 204), then
      # fallback to a TCP socket probe if HTTP fails.
      test: ["CMD-SHELL", ">-", "python3 - <<'PY'\nimport sys, urllib.request, socket\ntry:\n r = urllib.request.urlopen('http://127.0.0.1:9298/1.0/status', timeout=2)\n if getattr(r, 'status', None) in (200, 204):\n     sys.exit(0)\nexcept Exception:\n pass\ntry:\n socket.create_connection(('127.0.0.1', 9298), 2)\n sys.exit(0)\nexcept Exception:\n sys.exit(1)\nPY"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  chatd:
    build:
      context: .
      dockerfile: Dockerfile-chatd
    env_file:
      - variables.env
    depends_on:
      - rabbitmq
    networks:
      - default
    volumes:
      - ./etc/wazo-chatd.yml:/etc/wazo-chatd/config.yml:ro
      - ./etc/wazo-chatd.yml:/etc/wazo-chatd/conf.d/config.yml:ro
      - wazo-auth-keys:/var/lib/wazo-auth-keys:ro

  phoned:
    build:
      context: ./repos/wazo-phoned
    env_file:
      - variables.env
    depends_on:
      - rabbitmq
    networks:
      - default
    volumes:
      - ./etc/wazo-phoned.yml:/etc/wazo-phoned/conf.d/config.yml:ro
      - wazo-auth-keys:/var/lib/wazo-auth-keys:ro

  websocketd:
    build:
      context: ./repos/wazo-websocketd
    env_file:
      - variables.env
    depends_on:
      - rabbitmq
    networks:
      - default
  ui:
    build:
      context: ./repos/wazo-ui
    env_file:
      - variables.env
    expose:
      - 9296
    volumes:
      - ./etc/wazo-ui.yml:/etc/wazo-ui/conf.d/config.yml:ro
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile-bootstrap
    env_file:
      - variables.env
    restart: unless-stopped
    environment:
      - TOKEN
    depends_on:
      - auth
      - sysconfd
      - dird
      - webhookd
      - rabbitmq
      - confgend
    volumes:
      - ./bin/init-bootstrap:/bin/platform-bootstrap/init:ro
      - ./etc/wazo-auth-cli.yml:/etc/wazo-auth-cli/conf.d/config.yml:ro
      - wazo-auth-keys:/var/lib/wazo-auth-keys:rw
      - type: bind
        source: ./wazo-auth-keys/etc/wazo-auth-keys/config.yml
        target: /etc/wazo-auth-keys/config.yml
        read_only: true
    entrypoint:
      - /bin/platform-bootstrap/init

volumes:
  pgdata:
  provd-data:
  wazo-auth-keys:
  asterisk-autoprov:
  asterisk-doc:
  asterisk-voicemail:
  tmp-rabbitmq: # Compatibility for non-Linux systems
  migrator-venv-cache:
  migrator-logs:

networks:
  default:
  wazo:
