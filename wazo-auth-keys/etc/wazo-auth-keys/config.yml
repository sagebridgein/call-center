wazo-wizard:
  system_user: www-data
  acl:
    - '#'

# Sample default provisioning for softphone auth, devices, lines and a Twilio SIP trunk.
# Replace all placeholder values before using in production.

users:
  - id: alice
    username: alice
    password: "ChangeMeAlice!"   # change this
    display_name: "Alice Softphone"
    auth_type: sip
    devices:
      - id: alice-softphone
        type: softphone
        transport: udp
        contact: "sip:alice@192.168.1.50" # example contact for WebRTC/softphone
    lines:
      - id: alice-line
        number: "+15551230001"
        outbound_caller_id: "+15551230001"

  - id: bob
    username: bob
    password: "ChangeMeBob!"     # change this
    display_name: "Bob Softphone"
    auth_type: sip
    devices:
      - id: bob-softphone
        type: softphone
        transport: udp
        contact: "sip:bob@192.168.1.51"
    lines:
      - id: bob-line
        number: "+15551230002"
        outbound_caller_id: "+15551230002"

# SIP trunks configuration (example for Twilio SIP Trunking).
# Replace TWILIO_ACCOUNT_SID and TWILIO_AUTH_TOKEN with secure values.
sip_trunks:
  - id: twilio
    name: "twilio"
    provider: "twilio"
    domain: "sip.twilio.com"            # Twilio SIP termination domain
    username: "${TWILIO_ACCOUNT_SID}"   # recommended to use env var or secrets
    password: "${TWILIO_AUTH_TOKEN}"    # recommended to use env var or secrets
    from_number: "+1XXXXXXXXXX"         # your Twilio caller ID / phone number
    register: false                     # Twilio usually does not require register for trunking
    transport: udp                      # or tcp/tls depending on your setup
    extra:
      # Any provider-specific options can be added here
      sip_headers:
        X-Custom: "x-value"

routes:
  outbound:
    - id: default-outbound
      match_number_regex: ".*"
      trunk: "twilio"

  inbound:
    # inbound mapping from Twilio -> local user/line
    - id: twilio-to-alice
      source_trunk: "twilio"
      to_number: "+15551230001"
      target:
        type: "user"
        id: "alice"

# Example webhook or provisioning hooks (optional)
provisioning:
  enabled: true
  apply_on_startup: true

# Notes:
# - This file is an example. The provisioning tool you use may need a slightly different layout.
# - For production, store credentials in environment variables or a secret store and reference them here.
# - After editing, ensure the file is mounted in the container that performs provisioning (bootstrap / wazo-auth-cli).
